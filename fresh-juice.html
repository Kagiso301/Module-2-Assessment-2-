<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Fresh Fruit Juice | Savanna Bites</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

<header class="header">

    <div class="logo">

        <i class="fa-solid fa-utensils"></i>

        <span>
            Savanna <strong>Bites</strong>
        </span>

    </div>


    <nav>

        <a href="index.html">

            <i class="fa-solid fa-house"></i>
            Home

        </a>


        <a href="drinks.html">

            <i class="fa-solid fa-arrow-left"></i>
            Drinks

        </a>

    </nav>

</header>


<main class="container">

    <div class="meal-details">


        <!-- IMAGE -->

        <div class="meal-image">

            <img src="images/juice.jpeg"
                 alt="Fresh Fruit Juice">

        </div>


        <!-- DETAILS -->

        <div class="meal-content">

            <h1>Fresh Fruit Juice</h1>


            <div class="price">
                R45
            </div>


            <p class="serving">

                <i class="fa-solid fa-glass-water"></i>

                Serving size: 350ml

            </p>


            <p>

                Enjoy a refreshing blend of freshly squeezed
                seasonal fruits. Choose your favourite flavour
                and enjoy a naturally delicious drink with your meal.

            </p>


            <h3>

                <i class="fa-solid fa-plus"></i>

                Choose Your Extras

            </h3>


            <ul class="extras">

                <li>

                    <label>

                        <input type="checkbox">

                        Extra Ice

                    </label>

                </li>


                <li>

                    <label>

                        <input type="checkbox">

                        Extra Fruit (+R10)

                    </label>

                </li>


                <li>

                    <label>

                        <input type="checkbox">

                        Add Lemon (+R5)

                    </label>

                </li>


                <li>

                    <label>

                        <input type="checkbox">

                        Add Mint (+R5)

                    </label>

                </li>

            </ul>


            <!-- ORDER FORM -->

            <form action="order-success.html">

                <label for="notes">

                    <strong>
                        Special Instructions
                    </strong>

                </label>


                <textarea
                    id="notes"
                    name="notes"
                    rows="5"
                    placeholder="Example: No ice, extra cold, etc...">
                </textarea>


                <button type="submit"
                        class="order-btn">

                    <i class="fa-solid fa-cart-shopping"></i>

                    Place Order

                </button>

            </form>

        </div>

    </div>

</main>


<footer>

    <div class="footer-logo">

        <i class="fa-solid fa-utensils"></i>

        Savanna Bites

    </div>


    <p>
        Good food. Good people. Good memories.
    </p>

</footer>

</body>

</html>
