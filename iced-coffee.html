<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iced Coffee | Savanna Bites</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

<header class="header">

    <div class="logo">

        <i class="fa-solid fa-utensils"></i>

        <span>
            Savanna <strong>Bites</strong>
        </span>

    </div>


    <nav>

        <a href="index.html">
            <i class="fa-solid fa-house"></i>
            Home
        </a>

        <a href="drinks.html">
            <i class="fa-solid fa-arrow-left"></i>
            Drinks
        </a>

    </nav>

</header>


<main class="container">

    <div class="meal-details">


        <div class="meal-image">

            <img src="images/icedCoffee.jpeg"
                 alt="Iced Coffee">

        </div>


        <div class="meal-content">

            <h1>Iced Coffee</h1>


            <div class="price">
                R40
            </div>


            <p class="serving">

                <i class="fa-solid fa-mug-hot"></i>

                Serving size: 350ml

            </p>


            <p>

                Smooth chilled coffee served over ice,
                blended with creamy milk and a touch
                of sweetness. The perfect pick-me-up.

            </p>


            <h3>

                <i class="fa-solid fa-plus"></i>

                Choose Your Extras

            </h3>


            <ul class="extras">

                <li>

                    <label>

                        <input type="checkbox">

                        Extra Shot (+R15)

                    </label>

                </li>


                <li>

                    <label>

                        <input type="checkbox">

                        Whipped Cream (+R10)

                    </label>

                </li>


                <li>

                    <label>

                        <input type="checkbox">

                        Caramel Syrup (+R10)

                    </label>

                </li>


                <li>

                    <label>

                        <input type="checkbox">

                        Vanilla Syrup (+R10)

                    </label>

                </li>

            </ul>


            <form action="order-success.html">

                <label for="notes">

                    <strong>
                        Special Instructions
                    </strong>

                </label>


                <textarea
                    id="notes"
                    name="notes"
                    rows="5"
                    placeholder="Add any special requests here...">
                </textarea>


                <button type="submit"
                        class="order-btn">

                    <i class="fa-solid fa-cart-shopping"></i>

                    Place Order

                </button>

            </form>

        </div>

    </div>

</main>


<footer>

    <div class="footer-logo">

        <i class="fa-solid fa-utensils"></i>

        Savanna Bites

    </div>


    <p>
        Good food. Good people. Good memories.
    </p>

</footer>

</body>

</html>
