<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ice Cream Delight | Savanna Bites</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

<div class="logo">
<i class="fa-solid fa-utensils"></i>
Savanna <strong>Bites</strong>
</div>

<nav>

<a href="index.html">
<i class="fa-solid fa-house"></i> Home
</a>

<a href="desserts.html">
<i class="fa-solid fa-arrow-left"></i> Desserts
</a>

</nav>

</header>


<main class="container">

<div class="meal-details">

<div class="meal-image">

<img src="images/iceCream.jpeg"
alt="Malva Pudding">

</div>


<div class="meal-content">

<h1>Ice Cream Delight</h1>

<div class="price">R65</div>

<p class="serving">
<i class="fa-solid fa-users"></i>
Serving size: 1 person
</p>

<p>
Three scoops of creamy ice cream with your choice of toppings.
</p>


<h3>Choose Your Extras</h3>

<ul class="extras">

<li>
<label>
<input type="checkbox">
Vanilla Ice Cream (+R20)
</label>
</li>

<li>
<label>
<input type="checkbox">
Extra Strawberries (+R10)
</label>
</li>

<li>
<label>
<input type="checkbox">
Caramel Sauce (+R10)
</label>
</li>

</ul>


<form action="order-success.html">

<label for="notes">
<strong>Special Instructions</strong>
</label>

<textarea
id="notes"
rows="5"
placeholder="Add any special requests here..."></textarea>

<button type="submit" class="order-btn">

<i class="fa-solid fa-cart-shopping"></i>

Place Order

</button>

</form>

</div>

</div>

</main>


<footer>

<div class="footer-logo">
<i class="fa-solid fa-utensils"></i>
Savanna Bites
</div>

<p>Good food. Good people. Good memories.</p>

</footer>

</body>
</html>
