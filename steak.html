<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grilled Steak | Savanna Bites</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

<div class="logo">
<i class="fa-solid fa-utensils"></i>
Savanna <strong>Bites</strong>
</div>

<nav>
<a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
<a href="mains.html"><i class="fa-solid fa-arrow-left"></i> Main Meals</a>
</nav>

</header>


<main class="container">

<div class="meal-details">

<div class="meal-image">
<img src="images/steak.jpeg" alt="Grilled Steak">
</div>


<div class="meal-content">

<h1>Grilled Steak</h1>

<div class="price">R190</div>

<p class="serving">
<i class="fa-solid fa-users"></i>
Serving size: 1 person
</p>

<p>
A tender flame-grilled steak seasoned with our
special house spices and served with crispy chips
and seasonal vegetables.
</p>


<h3>Choose Your Extras</h3>

<ul class="extras">

<li>
<label>
<input type="checkbox">
Extra Mushrooms (+R20)
</label>
</li>

<li>
<label>
<input type="checkbox">
Pepper Sauce (+R15)
</label>
</li>

<li>
<label>
<input type="checkbox">
Cheese Sauce (+R15)
</label>
</li>

<li>
<label>
<input type="checkbox">
Extra Chips (+R25)
</label>
</li>

</ul>


<form action="order-success.html">

<label for="notes">
<strong>Special Instructions</strong>
</label>

<textarea
id="notes"
rows="5"
placeholder="Add any special requests here..."></textarea>

<button type="submit" class="order-btn">
<i class="fa-solid fa-cart-shopping"></i>
Place Order
</button>

</form>

</div>

</div>

</main>


<footer>

<div class="footer-logo">
<i class="fa-solid fa-utensils"></i>
Savanna Bites
</div>

<p>Good food. Good people. Good memories.</p>

</footer>

</body>
</html>
